name: Build ReportKeeper Test APK
on:
  push:
    branches: [reportkeeper-apk-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble APK
        working-directory: reportkeeper_android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s reportkeeper_android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum reportkeeper_android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReportKeeper-v0.1-test-APK
          path: reportkeeper_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
